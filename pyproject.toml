[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dart-career"
version = "0.1.0"
description = "OpenDART 기반 자기소개서 리서치 도우미"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "openai>=1.99,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]
preload = ["finance-datareader>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
